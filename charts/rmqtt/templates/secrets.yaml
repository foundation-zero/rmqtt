{{- if not .Values.acl.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rmqtt.aclSecretName" . }}
  labels:
    {{- include "rmqtt.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $passwords := default dict .Values.aclPasswords }}
  {{- range .Values.acl.users }}
  {{- $key := include "rmqtt.passwordKey" . }}
  {{ $key }}: {{ get $passwords $key | toString | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.httpApi.bearerToken.enabled (not .Values.httpApi.bearerToken.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rmqtt.apiTokenSecretName" . }}
  labels:
    {{- include "rmqtt.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.httpApiBearerToken | toString | b64enc | quote }}
{{- end }}
