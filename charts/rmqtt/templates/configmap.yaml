{{- $l := .Values.broker.listeners -}}
{{- define "rmqtt.listenerCommon" -}}
{{- $p := index . 0 }}{{- $l := index . 1 -}}
{{ $p }}.max_connections = {{ int $l.maxConnections }}
{{ $p }}.max_handshaking_limit = {{ int $l.maxHandshakingLimit }}
{{ $p }}.handshake_timeout = {{ $l.handshakeTimeout | quote }}
{{ $p }}.max_packet_size = {{ $l.maxPacketSize | quote }}
{{ $p }}.max_inflight = {{ int $l.maxInflight }}
{{ $p }}.max_mqueue_len = {{ int $l.maxMqueueLen }}
{{ $p }}.mqueue_rate_limit = {{ $l.mqueueRateLimit | quote }}
{{ $p }}.session_expiry_interval = {{ $l.sessionExpiryInterval | quote }}
{{ $p }}.message_expiry_interval = {{ $l.messageExpiryInterval | quote }}
{{ $p }}.allow_anonymous = false
{{ $p }}.proxy_protocol = {{ $l.proxyProtocol }}
{{ $p }}.proxy_protocol_timeout = {{ $l.proxyProtocolTimeout | quote }}
{{- end -}}
{{- define "rmqtt.listenerTls" -}}
{{- $p := index . 0 }}{{- $tls := index . 1 -}}
{{ $p }}.cert = "/etc/rmqtt-tls/tls.crt"
{{ $p }}.key = "/etc/rmqtt-tls/tls.key"
{{- if $tls.mutualTls }}
{{ $p }}.cross_certificate = true
{{ $p }}.client_ca_certs = "/etc/rmqtt-tls/ca.crt"
{{- else }}
{{ $p }}.cross_certificate = false
{{- end }}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rmqtt.fullname" . }}
  labels:
    {{- include "rmqtt.labels" . | nindent 4 }}
data:
  rmqtt.toml: |
    # Generated by the rmqtt Helm chart. --id, --node-grpc-addrs and --raft-peer-addrs
    # are passed on the command line per pod.
    task.exec_workers = {{ int .Values.broker.task.execWorkers }}
    task.exec_queue_max = {{ int .Values.broker.task.execQueueMax }}

    node.busy.check_enable = false

    rpc.server_addr = "0.0.0.0:{{ int .Values.cluster.grpcPort }}"
    rpc.reuseaddr = true
    rpc.reuseport = false

    log.to = "console"
    log.level = {{ .Values.broker.log.level | quote }}

    plugins.dir = "/etc/rmqtt/plugins/"
    {{- $plugins := concat (list "rmqtt-cluster-raft" "rmqtt-acl") .Values.broker.plugins | uniq }}
    plugins.default_startups = {{ toJson $plugins }}
    plugins.disabled_default_startups = []

    mqtt.max_sessions = {{ int .Values.broker.mqtt.maxSessions }}

    {{- if $l.tcp.enabled }}

    listener.tcp.external.addr = "0.0.0.0:{{ int $l.tcp.port }}"
    {{- include "rmqtt.listenerCommon" (list "listener.tcp.external" $l) | nindent 4 }}
    {{- end }}

    {{- if $l.internal.enabled }}

    # Anonymous internal listener: not exposed by any Service, NetworkPolicy-restricted.
    listener.tcp.internal.addr = "0.0.0.0:{{ int $l.internal.port }}"
    listener.tcp.internal.allow_anonymous = true
    listener.tcp.internal.max_inflight = 128
    listener.tcp.internal.mqueue_rate_limit = "5000,1s"
    {{- end }}

    {{- if $l.ws.enabled }}

    listener.ws.external.addr = "0.0.0.0:{{ int $l.ws.port }}"
    {{- include "rmqtt.listenerCommon" (list "listener.ws.external" $l) | nindent 4 }}
    {{- end }}

    {{- if .Values.tls.existingSecret }}

    listener.tls.external.addr = "0.0.0.0:{{ int $l.tls.port }}"
    {{- include "rmqtt.listenerCommon" (list "listener.tls.external" $l) | nindent 4 }}
    {{- include "rmqtt.listenerTls" (list "listener.tls.external" .Values.tls) | nindent 4 }}

    listener.wss.external.addr = "0.0.0.0:{{ int $l.wss.port }}"
    {{- include "rmqtt.listenerCommon" (list "listener.wss.external" $l) | nindent 4 }}
    {{- include "rmqtt.listenerTls" (list "listener.wss.external" .Values.tls) | nindent 4 }}
    {{- end }}
    {{- with .Values.broker.extraConfig }}

    {{- . | nindent 4 }}
    {{- end }}

  rmqtt-cluster-raft.toml: |
    worker_threads = {{ int .Values.cluster.workerThreads }}
    message_type = 198
    # node_grpc_addrs / raft_peer_addrs come from --node-grpc-addrs / --raft-peer-addrs.
    node_grpc_addrs = []
    raft_peer_addrs = []
    node_grpc_batch_size = 128
    node_grpc_client_concurrency_limit = 128
    node_grpc_client_timeout = {{ .Values.cluster.nodeGrpcClientTimeout | quote }}
    laddr = "0.0.0.0:{{ int .Values.cluster.raftPort }}"
    leader_id = {{ int .Values.cluster.leaderId }}
    try_lock_timeout = {{ .Values.cluster.tryLockTimeout | quote }}
    task_exec_queue_workers = 500
    task_exec_queue_max = 100_000
    compression = "zstd"
    health.exit_on_node_unavailable = {{ .Values.cluster.health.exitOnNodeUnavailable }}
    health.exit_code = -1
    health.max_continuous_unavailable_count = {{ int .Values.cluster.health.maxContinuousUnavailableCount }}
    health.unavailable_check_interval = {{ .Values.cluster.health.unavailableCheckInterval | quote }}
    raft.grpc_timeout = "6s"
    raft.grpc_concurrency_limit = 200
    raft.grpc_breaker_threshold = 5
    raft.grpc_breaker_retry_interval = "2500ms"
    raft.proposal_batch_size = 60
    raft.proposal_batch_timeout = "200ms"
    raft.snapshot_interval = "300s"
    raft.heartbeat = "100ms"
    raft.election_tick = 10
    raft.heartbeat_tick = 5
    raft.max_size_per_msg = 0
    raft.max_inflight_msgs = 256
    raft.check_quorum = true
    raft.pre_vote = true
    raft.min_election_tick = 0
    raft.max_election_tick = 0
    raft.read_only_option = "Safe"
    raft.skip_bcast_commit = false
    raft.batch_append = false
    raft.priority = 0
    {{- with .Values.cluster.extraConfig }}
    {{- . | nindent 4 }}
    {{- end }}

  rmqtt-http-api.toml: |
    max_row_limit = 10_000
    http_laddr = "0.0.0.0:{{ int .Values.httpApi.port }}"
    # http_bearer_token is injected via RMQTT_PLUGIN_RMQTT_HTTP_API_HTTP_BEARER_TOKEN.
    http_request_log = {{ .Values.httpApi.requestLog }}
    message_expiry_interval = "5m"
    prometheus_metrics_cache_interval = "5s"
    # No `storage` section: stats/metrics history persistence is disabled.
    {{- with .Values.httpApi.extraConfig }}
    {{- . | nindent 4 }}
    {{- end }}

  rmqtt-retainer.toml: |
    storage.type = "ram"
    max_retained_messages = 0
    max_payload_size = "1MB"
    retained_message_ttl = "0m"
    batch_messages_limit = 500

  rmqtt-shared-subscription.toml: |
    strategy = "round_robin"
    sticky_cache_size = 100000

  {{- range $name, $content := .Values.broker.extraPluginConfigs }}
  {{- if eq $name "rmqtt-acl" }}{{ fail "configure rmqtt-acl through .Values.acl, not broker.extraPluginConfigs" }}{{ end }}
  {{ printf "%s.toml" $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
