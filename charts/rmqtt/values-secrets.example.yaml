# Copy to values-secrets.yaml (gitignored, excluded from the packaged chart) and pass it
# as an extra values file:
#
#   helm upgrade --install mqtt ./charts/rmqtt -f my-values.yaml -f values-secrets.yaml
#
# Not needed when acl.existingSecret / httpApi.bearerToken.existingSecret are used.

# One entry per acl.users[].passwordKey (defaults to the username).
aclPasswords:
  alice: "change-me-alice"
  dashboard: "change-me-dashboard"

# Required when httpApi.bearerToken.enabled=true and no existingSecret is set.
httpApiBearerToken: "change-me-long-random-token"
